volumes:
  vault-data:
networks:
  default:
  monitoring:
    name: grafana_monitoring-net
    external: true

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark-vault-bot
    restart: unless-stopped
    # Start's shutdown budget (20s hard deadline + 3s confirmation in
    # internal/adapter/telegram/bot.go) leaves the rest of this grace for
    # handler cleanup and BadgerDB's compact-on-close. Accepted updates are
    # allowed to finish before the deadline because Telegram's offset is a
    # watermark: cancelling one update forces every later one in the batch to
    # be redelivered. The final confirmation makes a completed batch survive
    # the restart. If a handler ignores cancellation, Start keeps waiting
    # rather than letting main close the store underneath it; Docker SIGKILLs
    # the process when this grace expires.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Bound to host loopback only: /metrics and /healthz must not be
      # reachable from outside the box. Prometheus scrapes the bot over the
      # grafana_monitoring-net docker network (ark-vault-bot:9102), which is
      # unaffected by this host binding.
      - "127.0.0.1:9102:9102"
    volumes:
      - vault-data:/data/badger
    networks:
      - default
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  vault-data:
networks:
  default:
  monitoring:
    name: grafana_monitoring-net
    external: true

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ark-vault-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Bound to host loopback only: /metrics and /healthz must not be
      # reachable from outside the box. Prometheus scrapes the bot over the
      # grafana_monitoring-net docker network (ark-vault-bot:9102), which is
      # unaffected by this host binding.
      - "127.0.0.1:9102:9102"
    volumes:
      - vault-data:/data/badger
    networks:
      - default
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

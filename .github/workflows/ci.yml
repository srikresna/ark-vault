name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  # Pin the exact patch: a floating '1.26' once resolved to 1.26.3 whose
  # stdlib still had open CVEs, failing the govulncheck gate.
  GO_VERSION: '1.26.9'
  REGISTRY: ghcr.io

jobs:
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional Commits are mandatory: every new commit subject must
      # match type(scope)?: description with an allowed type. Merge commits
      # are exempt.
      - name: Validate conventional commit subjects
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Validating subjects in range $RANGE"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_.-]+\))?(!)?: .{1,72}$'
          if git log --no-merges --pretty=%s "$RANGE" | grep -vE "$PATTERN" > /tmp/bad-subjects; then
            echo "The following commit subjects violate Conventional Commits:"
            cat /tmp/bad-subjects
            echo ""
            echo "Required format: type(scope)?: description  (types: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert, subject <= 72 chars)"
            exit 1
          fi
          echo "All commit subjects are conventional."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [commitlint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: the floating "latest" once installed a binary built with
          # go1.24, which refuses to lint a go.mod targeting go >= 1.25.
          version: v2.13.1
          args: --timeout=5m

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [commitlint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, vuln]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 7

      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: $COVERAGE%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov + 0 < 40.0) { printf "Coverage %.1f%% is below minimum threshold 40.0%%\n", cov; exit 1 } }'

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -trimpath \
            -o ark-vault \
            ./cmd/bot

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ark-vault-binary
          path: ark-vault
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # The secrets context is not allowed directly in a step-level `if`, so
      # gate on an env value populated from secrets instead. Skipping when the
      # SSH secrets are not configured keeps CI green on forks.
      - name: Deploy via SSH
        env:
          SSH_DEPLOY_ENABLED: ${{ secrets.SSH_HOST != '' && secrets.SSH_KEY != '' }}
        if: env.SSH_DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME || 'kresna' }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/kresna/ark-vault
            PREV_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            docker compose build --build-arg VERSION=${{ github.sha }}
            docker compose up -d --force-recreate
            # Health gate: wait up to 2 minutes for the container healthcheck,
            # then roll back to the previous commit if the new build is sick.
            ok=0
            for i in $(seq 1 12); do
              sleep 10
              if [ "$(docker inspect ark-vault-bot --format '{{.State.Health.Status}}' 2>/dev/null)" = "healthy" ]; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "new deploy unhealthy; rolling back to $PREV_SHA"
              git reset --hard "$PREV_SHA"
              docker compose build --build-arg VERSION="$PREV_SHA"
              docker compose up -d --force-recreate
              exit 1
            fi
            echo "deploy healthy"
